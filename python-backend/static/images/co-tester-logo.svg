<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="10" y="10" width="280" height="80" rx="20" ry="20" fill="url(#logoGradient)" />
  
  <!-- Rocket icon -->
  <g transform="translate(35, 30)">
    <!-- Rocket body -->
    <path d="M20 5 L30 5 Q35 5 35 10 L35 30 Q35 35 30 35 L20 35 Q15 35 15 30 L15 10 Q15 5 20 5 Z" fill="white"/>
    
    <!-- Rocket fins -->
    <path d="M15 20 L10 25 L10 30 L15 25 Z" fill="white" opacity="0.8"/>
    <path d="M35 20 L40 25 L40 30 L35 25 Z" fill="white" opacity="0.8"/>
    
    <!-- Rocket window -->
    <circle cx="25" cy="15" r="4" fill="#6366f1" opacity="0.7"/>
    
    <!-- Rocket flame -->
    <path d="M20 35 L25 45 L30 35 Z" fill="#ff6b6b"/>
    <path d="M22 35 L25 42 L28 35 Z" fill="#ffa726"/>
  </g>
  
  <!-- Co-Tester text -->
  <text x="85" y="60" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="start">Co-Tester</text>
</svg>