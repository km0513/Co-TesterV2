<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jira Dashboards (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='left-sidebar.css') }}">
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --bg: #f8fafc; --text: #111827; --muted: #6b7280; --border: #e5e7eb;
    }
    body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .page { margin-left: var(--sidebar-width, 280px); padding: 2rem; flex: 1 0 auto; }
    .card { border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    .card-header { background: white; border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; }
    .card-title { margin: 0; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: .5rem; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; box-shadow: 0 6px 16px rgba(79,70,229,.25); }
    .btn-outline-secondary { border-radius: 10px; }
    .pill { background: #eef2ff; border: 1px solid #e0e7ff; color: #3730a3; padding: .45rem .7rem; border-radius: 999px; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .loading-spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chart-card { min-height: 380px; }
    .saved-query { cursor: pointer; }

    /* Minimal clean enhancements */
    .table-responsive { position: relative; }
    table thead th { position: sticky; top: 0; background: #fff; z-index: 5; border-bottom: 1px solid var(--border); }
    table tbody tr:nth-child(even) td { background-color: #f9fafb; }
    table tbody tr:hover td { background-color: #eef2ff; }

    /* Actions bar responsive */
    #actionsBar { display: flex; gap: .5rem; flex-wrap: wrap; }
    @media (max-width: 576px) {
      .page { padding: 1rem; }
      #actionsBar { width: 100%; }
      #actionsBar > * { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  {% include 'left-sidebar.html' %}
  <div class="page">
    <div class="container-fluid">

      <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h1 class="card-title"><i class="fas fa-chart-line"></i> Jira Dashboards</h1>
          <span id="resultTotal" class="pill" style="display:none"></span>
        </div>
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-12">
              <label for="jqlInput" class="form-label">JQL</label>
              <textarea id="jqlInput" class="form-control mono" rows="2" placeholder="e.g. project = UPG AND updated >= -14d ORDER BY updated DESC"></textarea>
            </div>
            <div class="col-md-2">
              <label for="maxResults" class="form-label">Max results</label>
              <input type="number" id="maxResults" class="form-control" min="1" max="1000" value="200" />
            </div>
            <div id="actionsBar" class="col-md-6 d-flex gap-2">
              <button id="runBtn" class="btn btn-primary"><i class="fas fa-play"></i> Run</button>
              <a id="openInJira" href="#" target="_blank" rel="noopener" class="btn btn-outline-secondary"><i class="fab fa-jira"></i> Open in Jira</a>
              <button id="saveQueryBtn" class="btn btn-outline-secondary"><i class="fas fa-bookmark"></i> Save Query</button>
            </div>
            <div class="col-12">
              <div class="d-flex flex-wrap align-items-center gap-2">
                <strong class="text-muted">Quick JQL:</strong>
                <button class="btn btn-sm btn-outline-secondary quick" data-q="assignee = currentUser() AND resolution = Unresolved ORDER BY updated DESC">My open issues</button>
                <button class="btn btn-sm btn-outline-secondary quick" data-q="updated >= -7d ORDER BY updated DESC">Updated in last 7d</button>
                <button class="btn btn-sm btn-outline-secondary quick" data-q="created >= startOfMonth() ORDER BY created DESC">Created this month</button>
                <button class="btn btn-sm btn-outline-secondary quick" data-q="statusCategory != Done AND priority in (Highest, High) ORDER BY priority DESC, updated DESC">High priority open</button>
              </div>
            </div>
          </div>

          <div class="mt-3">
            <div class="d-flex align-items-center gap-2 mb-2">
              <strong class="text-muted">Saved:</strong>
              <div id="savedQueries" class="d-flex flex-wrap gap-2"></div>
            </div>
          </div>

          <div id="errorBox" class="alert alert-danger mt-3" role="alert" style="display:none;"></div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-lg-6">
          <div class="card chart-card">
            <div class="card-header"><h2 class="card-title" style="font-size:1.1rem"><i class="fas fa-tasks"></i> By Status</h2></div>
            <div class="card-body"><canvas id="chartStatus"></canvas></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card chart-card">
            <div class="card-header"><h2 class="card-title" style="font-size:1.1rem"><i class="fas fa-flag"></i> By Priority</h2></div>
            <div class="card-body"><canvas id="chartPriority"></canvas></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card chart-card">
            <div class="card-header"><h2 class="card-title" style="font-size:1.1rem"><i class="fas fa-user"></i> Top Assignees</h2></div>
            <div class="card-body"><canvas id="chartAssignee"></canvas></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card chart-card">
            <div class="card-header"><h2 class="card-title" style="font-size:1.1rem"><i class="fas fa-calendar"></i> Created by Day</h2></div>
            <div class="card-body"><canvas id="chartCreated"></canvas></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h2 class="card-title" style="font-size:1.1rem"><i class="fas fa-table"></i> Results</h2>
          <div id="loadingArea" style="display:none" class="d-flex align-items-center gap-2 text-muted"><div class="loading-spinner"></div> Loading...</div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead>
                <tr>
                  <th style="width:12%">Key</th>
                  <th>Summary</th>
                  <th style="width:12%">Status</th>
                  <th style="width:12%">Priority</th>
                  <th style="width:18%">Assignee</th>
                  <th style="width:14%">Updated</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  {% include 'footer.html' %}
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const jiraBase = {{ (session.get('jira_domain') or 'https://upgrad-jira.atlassian.net') | tojson }};

    let chartStatus, chartPriority, chartAssignee, chartCreated;

    function buildChart(ctx, type, labels, data, label) {
      const colors = [
        '#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#84cc16','#f97316','#14b8a6','#e11d48'
      ];
      const dataset = { label, data, backgroundColor: colors.slice(0, data.length), borderWidth: 0 };
      const config = {
        type,
        data: { labels, datasets: [dataset] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true } } }
      };
      return new Chart(ctx, config);
    }

    function refreshCharts(aggs) {
      try { chartStatus?.destroy(); } catch {}
      try { chartPriority?.destroy(); } catch {}
      try { chartAssignee?.destroy(); } catch {}
      try { chartCreated?.destroy(); } catch {}

      const s = aggs.byStatus || [], p = aggs.byPriority || [], a = aggs.byAssignee || [], d = aggs.createdByDay || [];

      chartStatus = buildChart(document.getElementById('chartStatus'), 'doughnut', s.map(x=>x.key), s.map(x=>x.value), 'Issues');
      chartPriority = buildChart(document.getElementById('chartPriority'), 'bar', p.map(x=>x.key), p.map(x=>x.value), 'Issues');
      chartAssignee = buildChart(document.getElementById('chartAssignee'), 'bar', a.map(x=>x.key), a.map(x=>x.value), 'Issues');
      chartCreated = buildChart(document.getElementById('chartCreated'), 'line', d.map(x=>x.key), d.map(x=>x.value), 'Created');
    }

    function formatDate(dtStr) {
      if (!dtStr) return '';
      try { return new Date(dtStr).toLocaleString(); } catch { return dtStr; }
    }

    function renderTable(issues) {
      const tbody = document.getElementById('resultsBody');
      tbody.textContent = '';
      const base = (jiraBase || 'https://upgrad-jira.atlassian.net').replace(/\/+$/, '');
      for (const it of issues) {
        const tr = document.createElement('tr');
        const tdKey = document.createElement('td');
        const a = document.createElement('a'); a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.href = `${base}/browse/${encodeURIComponent(it.key || '')}`; a.textContent = it.key || '';
        tdKey.appendChild(a);
        const tdSummary = document.createElement('td'); tdSummary.textContent = it.summary || '';
        const tdStatus = document.createElement('td'); tdStatus.textContent = it.status || '';
        const tdPriority = document.createElement('td'); tdPriority.textContent = it.priority || '';
        const tdAssignee = document.createElement('td'); tdAssignee.textContent = it.assignee || '';
        const tdUpdated = document.createElement('td'); tdUpdated.textContent = formatDate(it.updated);
        tr.appendChild(tdKey); tr.appendChild(tdSummary); tr.appendChild(tdStatus); tr.appendChild(tdPriority); tr.appendChild(tdAssignee); tr.appendChild(tdUpdated);
        tbody.appendChild(tr);
      }
    }

    function setLoading(on) {
      document.getElementById('loadingArea').style.display = on ? 'flex' : 'none';
    }

    function updateOpenInJiraLink() {
      const jql = document.getElementById('jqlInput').value.trim();
      const base = (jiraBase || 'https://upgrad-jira.atlassian.net').replace(/\/+$/, '');
      const url = `${base}/issues/?jql=${encodeURIComponent(jql)}`;
      document.getElementById('openInJira').href = url;
    }

    async function runJql() {
      const jql = document.getElementById('jqlInput').value.trim();
      const maxResults = parseInt(document.getElementById('maxResults').value || '200', 10);
      const errorBox = document.getElementById('errorBox');
      const totalPill = document.getElementById('resultTotal');
      errorBox.style.display = 'none';
      setLoading(true);
      try {
        const resp = await fetch('/api/jira/admin/run-jql', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jql, maxResults })
        });
        const data = await resp.json();
        setLoading(false);
        if (!resp.ok || !data.success) throw new Error((data && (data.error || data.details)) || `HTTP ${resp.status}`);
        totalPill.textContent = `Total: ${data.total}`; totalPill.style.display = 'inline-block';
        refreshCharts(data.aggregates || {});
        renderTable(Array.isArray(data.issues) ? data.issues : []);
      } catch (e) {
        setLoading(false);
        errorBox.textContent = `Error: ${e.message || e}`;
        errorBox.style.display = 'block';
      }
      updateOpenInJiraLink();
    }

    // Saved queries (localStorage only)
    const LS_KEY = 'adminDashSavedQueries';
    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; }
    }
    function saveSaved(arr) { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch {} }
    function renderSaved() {
      const box = document.getElementById('savedQueries'); box.textContent = '';
      const arr = loadSaved();
      if (!arr.length) { const small = document.createElement('small'); small.className='text-muted'; small.textContent='None yet'; box.appendChild(small); return; }
      for (let i=0; i<arr.length; i++) {
        const { name, jql } = arr[i];
        const span = document.createElement('span'); span.className = 'pill saved-query'; span.title = jql; span.textContent = name || `Query ${i+1}`;
        span.addEventListener('click', () => { document.getElementById('jqlInput').value = jql; updateOpenInJiraLink(); runJql(); });
        const del = document.createElement('button'); del.className = 'btn btn-sm btn-link text-danger'; del.innerHTML = '<i class="fas fa-times"></i>';
        del.addEventListener('click', (e) => { e.stopPropagation(); const now = loadSaved(); now.splice(i,1); saveSaved(now); renderSaved(); });
        const wrap = document.createElement('div'); wrap.className = 'd-flex align-items-center gap-1'; wrap.appendChild(span); wrap.appendChild(del);
        box.appendChild(wrap);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Defaults
      const jqlInput = document.getElementById('jqlInput');
      jqlInput.value = 'updated >= -14d ORDER BY updated DESC';
      updateOpenInJiraLink();

      // Events
      document.getElementById('runBtn').addEventListener('click', runJql);
      document.getElementById('saveQueryBtn').addEventListener('click', () => {
        const jql = document.getElementById('jqlInput').value.trim();
        const name = prompt('Name for this query?');
        if (!name) return;
        const arr = loadSaved(); arr.push({ name, jql }); saveSaved(arr); renderSaved();
      });
      document.querySelectorAll('.quick').forEach(btn => btn.addEventListener('click', (e) => {
        const q = e.currentTarget.getAttribute('data-q');
        document.getElementById('jqlInput').value = q; updateOpenInJiraLink(); runJql();
      }));
      document.getElementById('jqlInput').addEventListener('input', updateOpenInJiraLink);

      renderSaved();
      // Do not auto-run to avoid heavy calls; admin can click Run
    });
  </script>
</body>
</html>
