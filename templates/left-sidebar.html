<div class="sidebar" id="sidebar" style="display: none;">
  <!-- Toggle Button -->
  <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">
    <i class="fas fa-chevron-left"></i>
  </button>



  <!-- User Profile Section (shown when logged in) -->
  <div class="user-profile-section" id="userProfileSection" style="display: none;">
    <div class="user-profile">
      <div class="user-avatar">
        <img id="userAvatarImg" src="" alt="User Avatar" style="display: none;">
        <div id="userAvatarPlaceholder" class="avatar-placeholder">👤</div>

  <!-- Login Section (shown when not authenticated) -->
  <div class="login-profile-section" id="loginProfileSection" style="display: none;">

      <div class="login-avatar">
        <div class="login-avatar-placeholder">🔐</div>
      </div>
      <div class="login-info">
        <div class="login-text">Authentication Required</div>
        <div class="login-subtext">Connect to access features</div>
      </div>
      <div class="login-actions">
        <button class="login-btn" id="userLoginBtn" title="Login to Jira">
          <i class="fas fa-sign-in-alt"></i>
        </button>
      </div>
    </div>
  </div>
  
  <div class="sidebar-menu">

    <a href="#" data-href="/home" class="nav-link sidebar-item{% if active_tab == 'home' %} active{% endif %}" data-no-auth="true">

      <span class="sidebar-label">Home</span>
    </a>

   
    
    <a href="#" data-href="/test-generator" class="nav-link sidebar-item{% if active_tab == 'manual' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-magic"></i></span>
      <span class="sidebar-label">Test Generator <span class="ai-badge">AI</span></span>
      
    </a>
    
    <a href="#" data-href="/ui-analyzer" class="nav-link sidebar-item{% if active_tab == 'screen-analysis' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-search-plus"></i></span>
      <span class="sidebar-label">UI Analyzer <span class="ai-badge">AI</span></span>
      
    </a>

    
   
    <a href="#" data-href="/api-co-test" class="nav-link sidebar-item{% if active_tab == 'api' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-code"></i></span>
      <span class="sidebar-label">API Co-Test</span>
    </a>
    
    <a href="#" data-href="/pom-builder" data-auth-required class="nav-link sidebar-item{% if active_tab == 'pom-builder' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-cubes"></i></span>
      <span class="sidebar-label">POM Builder <span class="ai-badge">AI</span></span>
    </a>
    
    <a href="#" data-href="/data-generator" class="nav-link sidebar-item{% if active_tab == 'data' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-database"></i></span>
      <span class="sidebar-label">Data Generator</span>
    </a>

    <a href="#" data-href="/bug-builder" class="nav-link sidebar-item{% if active_tab == 'bug-builder' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-bug"></i></span>
      <span class="sidebar-label">Bug Builder <span class="ai-badge">AI</span></span>
    </a>
    -->
    
    <!-- Context Builder hidden until ready -->

    <a href="#" data-href="/context-builder" class="nav-link sidebar-item{% if active_tab == 'context-builder' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-brain"></i></span>
      <span class="sidebar-label">Context Builder <span class="ai-badge">AI</span></span>
    </a>
    -->
    
    <a href="#" data-href="/learning-resources" class="nav-link sidebar-item{% if active_tab == 'learning' %} active{% endif %}" data-no-auth="true">
      <span class="sidebar-icon"><i class="fas fa-graduation-cap"></i></span>
      <span class="sidebar-label">Learning Resources</span>
    </a>
    
    <a href="#" data-href="/my-details" class="nav-link sidebar-item{% if active_tab == 'jira' %} active{% endif %}">
      <span class="sidebar-icon"><i class="fas fa-user-circle"></i></span>
      <span class="sidebar-label">My Details</span>
    </a>
    
    {% if false %}
    
    
    <a href="#" data-href="/browseruse-automation" class="nav-link sidebar-item{% if active_tab == 'browseruse' %} active{% endif %}">
      <span class="sidebar-icon">🤖</span>
      <span class="sidebar-label">UI Automation</span>
    </a>
    <a href="#" data-href="/dom-extractor" class="nav-link sidebar-item{% if active_tab == 'dom-extractor' %} active{% endif %}">
      <span class="sidebar-icon">💻</span>
      <span class="sidebar-label">DOM Extractor</span>

</div>

<div class="mobile-toggle">
  <button id="sidebarToggle">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
</div>

<script>
  // Mobile sidebar toggle functionality
  document.getElementById('sidebarToggle').addEventListener('click', function() {
    document.querySelector('.sidebar').classList.toggle('sidebar-open');
  });
  
  // Close sidebar when clicking outside on mobile
  document.addEventListener('click', function(event) {
    const sidebar = document.querySelector('.sidebar');
    const toggle = document.getElementById('sidebarToggle');
    
    if (window.innerWidth <= 768 && 
        sidebar.classList.contains('sidebar-open') && 
        !sidebar.contains(event.target) && 
        event.target !== toggle) {
      sidebar.classList.remove('sidebar-open');
    }
  });



  // Jira status loader functions
  function showJiraStatusLoader() {
    if (!document.getElementById('jiraStatusLoader')) {
      const loader = document.createElement('div');
      loader.id = 'jiraStatusLoader';
      loader.innerHTML = `
        <div class="loader-overlay">
          <div class="loader-content">
            <div class="loader-spinner"></div>
            <h3>Checking Authentication...</h3>
            <p>Please wait while we verify your authentication status</p>
          </div>
        </div>
      `;
      document.body.appendChild(loader);
    }
    document.getElementById('jiraStatusLoader').style.display = 'flex';
  }

  function hideJiraStatusLoader() {
    const loader = document.getElementById('jiraStatusLoader');
    if (loader) {
      loader.style.display = 'none';
    }
  }

  function showJiraLoginModal(targetUrl) {
    if (!document.getElementById('jiraLoginModal')) {
      const modal = document.createElement('div');
      modal.id = 'jiraLoginModal';
      modal.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-content">
            <div class="modal-header">
              <h3><i class="fas fa-shield-alt"></i> Authentication Required</h3>
              <button class="modal-close" onclick="closeJiraLoginModal()">&times;</button>
            </div>
            <div class="modal-body">
              <p>You need to authenticate to access this feature. Authentication is currently configured for Jira to ensure secure integration with your project management workflow.</p>
              <div class="modal-actions">
                <button class="btn-primary" onclick="connectToJira()">
                  <i class="fas fa-plug"></i> Authenticate
                </button>
                <button class="btn-secondary" onclick="closeJiraLoginModal()">
                  <i class="fas fa-times"></i> Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }
    document.getElementById('jiraLoginModal').style.display = 'flex';
    document.getElementById('jiraLoginModal').setAttribute('data-target-url', targetUrl);
  }

  function closeJiraLoginModal() {
    const modal = document.getElementById('jiraLoginModal');
    if (modal) {
      modal.style.display = 'none';
      // Navigate back to dashboard when modal is cancelled
      window.location.href = '/';
    }
  }

  function connectToJira() {
    window.location.href = '/api/jira/oauth/login';
  }
  
  // Navigation handling
  document.addEventListener('DOMContentLoaded', function() {
    let isConnectedToJira = false;

    // Navigation state management
    let previousActiveItem = null;
    
    // Restore sidebar visibility if navigating between pages
    if (sessionStorage.getItem('sidebarVisible') === 'true') {
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        sidebar.style.display = 'flex';
        sidebar.style.visibility = 'visible';
        sidebar.style.opacity = '1';
        sidebar.style.zIndex = '1000';
      }
    }
    
    // Handle all navigation links
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        // Get target URL from data-href
        let targetUrl = this.getAttribute('data-href');
        
        // Validate URL
        if (!targetUrl || targetUrl === '#' || targetUrl === 'null') {
          console.error('No valid target URL found for navigation');
          return;
        }

        // Check if this link requires authentication
        const noAuth = this.getAttribute('data-no-auth') === 'true';
        
        // Update active state immediately for smooth UX
        updateActiveNavState(this);
        
        if (noAuth) {
          // Navigate directly for no-auth pages (like dashboard)
          performNavigation(targetUrl, false);
        } else {
          // Show loading indicator for authentication check
          showNavigationLoader('Verifying Authentication', 'Please wait while we check your Jira connection...');
          
          // Check authentication before navigation
          fetch('/api/jira/status')
            .then(response => response.json())
            .then(data => {
              if (data.connected) {
                // Connected - update loader message and proceed to the page
                updateLoaderMessage('Navigating', 'Loading your requested page...');
                performNavigation(targetUrl, true);
              } else {
                // Not connected - hide loader and show login prompt
                hideNavigationLoader();
                showJiraLoginModal(targetUrl);
                // Restore previous active state
                restorePreviousActiveState();
              }
            })
            .catch(error => {
              hideNavigationLoader();
              console.error('Error checking authentication status:', error);
              showJiraLoginModal(targetUrl);
              restorePreviousActiveState();
            });
        }
      });
    });
    
    // Perform navigation with proper state management
    function performNavigation(url, keepLoader = false) {
      // Store sidebar state in sessionStorage
      sessionStorage.setItem('sidebarVisible', 'true');
      
      // Ensure the sidebar remains visible during navigation
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        sidebar.style.zIndex = '10000'; // Keep sidebar above loader
      }
      
      // If we're already showing a loader, update it
      if (!keepLoader) {
        showNavigationLoader('Navigating', 'Loading your requested page...');
      }
      
      // Navigate after a short delay to allow loader to display
      setTimeout(() => {
        window.location.href = url;
      }, 200);
    }
    
    // Update active navigation state
    function updateActiveNavState(clickedItem) {
      // Store current active item for potential restoration
      previousActiveItem = document.querySelector('.sidebar-item.active');
      
      // Remove active class from all sidebar items
      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
      });
      
      // Add active class to clicked item
      clickedItem.classList.add('active');
    }
    
    function restorePreviousActiveState() {
      // Remove active from current
      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
      });
      
      // Restore previous active state
      if (previousActiveItem) {
        previousActiveItem.classList.add('active');
      }
    }
    
    // Full-screen navigation loader to prevent layout shifts
    function showNavigationLoader(title = 'Verifying Authentication', message = 'Please wait while we check your Jira connection...') {
      if (document.getElementById('navigationLoader')) {
        // Update existing loader message
        updateLoaderMessage(title, message);
        return;
      }
      
      const loader = document.createElement('div');
      loader.id = 'navigationLoader';
      loader.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(5px);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.2s ease;
      `;
      
      // Create loader content
      const loaderContent = document.createElement('div');
      loaderContent.id = 'loaderContent';
      loaderContent.style.cssText = `
        text-align: center;
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        max-width: 90%;
        width: 400px;
      `;
      
      // Create spinner
      const spinner = document.createElement('div');
      spinner.style.cssText = `
        width: 40px;
        height: 40px;
        margin: 0 auto 1rem auto;
        border: 3px solid rgba(99, 102, 241, 0.3);
        border-radius: 50%;
        border-top-color: #6366f1;
        animation: spin 1s ease-in-out infinite;
      `;
      
      // Create message container
      const messageContainer = document.createElement('div');
      messageContainer.id = 'loaderMessageContainer';
      messageContainer.innerHTML = `
        <h3 id="loaderTitle" style="margin: 0 0 0.5rem 0; color: #1f2937; font-weight: 600;">${title}</h3>
        <p id="loaderMessage" style="margin: 0; color: #6b7280;">${message}</p>
      `;
      
      // Add animation style
      if (!document.getElementById('spinnerStyle')) {
        const style = document.createElement('style');
        style.id = 'spinnerStyle';
        style.textContent = `
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        `;
        document.head.appendChild(style);
      }
      
      // Assemble loader
      loaderContent.appendChild(spinner);
      loaderContent.appendChild(messageContainer);
      loader.appendChild(loaderContent);
      document.body.appendChild(loader);
      
      // Ensure the sidebar stays visible above the loader
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) {
        sidebar.style.zIndex = '10000';
      }
      
      // Prevent layout shifts by disabling scrolling temporarily
      document.body.style.overflow = 'hidden';
    }
    
    // Update loader message without recreating the loader
    function updateLoaderMessage(title, message) {
      const titleElement = document.getElementById('loaderTitle');
      const messageElement = document.getElementById('loaderMessage');
      
      if (titleElement && messageElement) {
        titleElement.textContent = title;
        messageElement.textContent = message;
      }
    }
    
    function hideNavigationLoader() {
      const loader = document.getElementById('navigationLoader');
      if (loader) {
        // Fade out the loader
        loader.style.opacity = '0';
        
        // Re-enable scrolling
        document.body.style.overflow = '';
        
        // Remove loader after animation completes
        setTimeout(() => {
          loader.remove();
        }, 200);
      }
    }
    
    // Check Jira connection status
    function checkJiraStatus() {
      fetch('/api/jira/status')
        .then(response => response.json())
        .then(data => {
          isConnectedToJira = data.connected;
          
          if (data.connected) {
            // Check user info if connected
            checkUserInfo();
          } else {
            // Hide user profile if not connected
            hideUserProfile();
          }
        })
        .catch(error => {
          console.error('Error checking authentication status:', error);
          isConnectedToJira = false;
          hideUserProfile();
        });
    }
    
    // Check for user info and welcome message
    function checkUserInfo() {
      fetch('/api/jira/user-info')
        .then(response => response.json())
        .then(data => {
          if (data.authenticated) {
            updateUserProfile(data);
            if (data.show_welcome) {
              showWelcomeMessage(data.user_name, data.user_email, data.user_avatar);
            }
          } else {
            hideUserProfile();
          }
        })
        .catch(error => {
          console.error('Error checking user info:', error);
          hideUserProfile();
        });
    }
    
    // Update user profile in sidebar
    function updateUserProfile(userData) {
      console.log('Updating user profile with data:', userData);
      
      const userName = document.getElementById('userName');
      const userEmail = document.getElementById('userEmail');
      const userAvatarImg = document.getElementById('userAvatarImg');
      const userAvatarPlaceholder = document.getElementById('userAvatarPlaceholder');
      
      // Show the profile section and hide login section
      showUserProfile();
      
      // Update user name and email
      const displayName = userData.user_name || 'User';
      const displayEmail = userData.user_email || 'Connected to Jira';
      
      console.log('Setting user name to:', displayName);
      console.log('Setting user email to:', displayEmail);
      
      userName.textContent = displayName;
      userEmail.textContent = displayEmail;
      
      // Update avatar
      if (userData.user_avatar) {
        userAvatarImg.src = userData.user_avatar;
        userAvatarImg.style.display = 'block';
        userAvatarPlaceholder.style.display = 'none';
      } else {
        userAvatarImg.style.display = 'none';
        userAvatarPlaceholder.style.display = 'flex';
        userAvatarPlaceholder.textContent = displayName.charAt(0).toUpperCase();
      }
    }
    
    // Hide user profile and show login section - HIDE ENTIRE SIDEBAR when not authenticated
    function hideUserProfile() {
      const userProfileSection = document.getElementById('userProfileSection');
      const loginProfileSection = document.getElementById('loginProfileSection');
      const sidebar = document.getElementById('sidebar');
      const mainContent = document.querySelector('.main-content');
      const quotesHeader = document.querySelector('.quotes-header');
      
      // Hide the entire sidebar when not authenticated
      sidebar.style.display = 'none';
      
      // Adjust main content to take full width
      if (mainContent) {
        mainContent.style.marginLeft = '0px';
        mainContent.style.transition = 'margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
      }
      
      // Trigger authentication state change event for quotes header
      window.dispatchEvent(new CustomEvent('authStateChanged', { 
        detail: { authenticated: false, sidebarVisible: false } 
      }));
      
      // Keep the original profile switching logic for when sidebar is shown
      userProfileSection.style.display = 'none';
      loginProfileSection.style.display = 'block';
    }
    
    // Show user profile and hide login section - SHOW ENTIRE SIDEBAR when authenticated
    function showUserProfile() {
      const userProfileSection = document.getElementById('userProfileSection');
      const loginProfileSection = document.getElementById('loginProfileSection');
      const sidebar = document.getElementById('sidebar');
      const mainContent = document.querySelector('.main-content');
      const quotesHeader = document.querySelector('.quotes-header');
      
      // Show the entire sidebar when authenticated
      sidebar.style.display = 'flex';
      
      // Restore main content margin based on sidebar state
      const isCollapsed = sidebar.classList.contains('collapsed');
      const isMobile = window.innerWidth <= 768;
      
      if (mainContent) {
        let newMargin;
        if (isMobile) {
          newMargin = isCollapsed ? '80px' : '280px';
        } else {
          newMargin = isCollapsed ? '80px' : '280px';
        }
        mainContent.style.marginLeft = newMargin;
        mainContent.style.transition = 'margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
      }
      
      // Trigger authentication state change event for quotes header
      window.dispatchEvent(new CustomEvent('authStateChanged', { 
        detail: { authenticated: true, sidebarVisible: true, collapsed: isCollapsed } 
      }));
      
      // Show user profile and hide login section
      userProfileSection.style.display = 'block';
      loginProfileSection.style.display = 'none';
    }
    
    // Show welcome message
    function showWelcomeMessage(userName, userEmail, userAvatar) {
      // Create welcome modal
      const welcomeModal = document.createElement('div');
      welcomeModal.id = 'welcomeModal';
      welcomeModal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        animation: fadeIn 0.3s ease;
      `;
      
      const welcomeContent = document.createElement('div');
      welcomeContent.style.cssText = `
        background: white;
        padding: 2rem;
        border-radius: 16px;
        text-align: center;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease;
      `;
      
      const avatarImg = userAvatar ? `<img src="${userAvatar}" style="width: 60px; height: 60px; border-radius: 50%; margin-bottom: 1rem;" alt="User Avatar">` : '';
      
      welcomeContent.innerHTML = `
        ${avatarImg}
        <h2 style="color: #6366f1; margin-bottom: 0.5rem; font-size: 1.5rem;">🎉 Welcome to Co-Tester!</h2>
        <p style="color: #64748b; margin-bottom: 0.5rem; font-size: 1.1rem;">Hello, <strong>${userName}</strong>!</p>
        <p style="color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem;">${userEmail}</p>
        <p style="color: #374151; margin-bottom: 1.5rem;">You're now connected to Jira and ready to start testing!</p>
        <button id="welcomeOkBtn" style="
          background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
          color: white;
          border: none;
          padding: 0.75rem 2rem;
          border-radius: 8px;
          cursor: pointer;
          font-weight: 600;
          font-size: 1rem;
        ">Get Started</button>
      `;
      
      welcomeModal.appendChild(welcomeContent);
      document.body.appendChild(welcomeModal);
      
      // Add CSS animations
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes slideIn {
          from { transform: translateY(-50px) scale(0.9); opacity: 0; }
          to { transform: translateY(0) scale(1); opacity: 1; }
        }
      `;
      document.head.appendChild(style);
      
      // Close modal functionality
      document.getElementById('welcomeOkBtn').addEventListener('click', function() {
        welcomeModal.style.animation = 'fadeOut 0.3s ease';
        setTimeout(() => {
          document.body.removeChild(welcomeModal);
          document.head.removeChild(style);
        }, 300);
      });
      
      // Auto close after 10 seconds
      setTimeout(() => {
        if (document.getElementById('welcomeModal')) {
          document.getElementById('welcomeOkBtn').click();
        }
      }, 10000);
    }
    

    
    // User profile and login buttons
    document.addEventListener('click', function(e) {
      if (e.target.closest('#userLogoutBtn')) {
        logoutFromJira();
      }
      if (e.target.closest('#userLoginBtn')) {
      window.location.href = '/api/jira/oauth/login';
      }
    });
    
    
    // Logout function
    function logoutFromJira() {
      fetch('/api/jira/logout', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Redirect to home page after successful logout
            window.location.href = '/';
          } else {
            alert('Failed to disconnect from Jira: ' + data.message);
          }
        })
        .catch(error => {
          console.error('Error disconnecting from Jira:', error);
          alert('Error disconnecting from Jira. Please try again.');
        });
    }
    
    // Initial status check
    checkJiraStatus();
    
    // Sidebar toggle functionality
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.querySelector('.main-content');
    
    sidebarToggle.addEventListener('click', function() {
      sidebar.classList.toggle('collapsed');
      updateSidebarState();
    });
    
    function updateSidebarState() {
      const isMobile = window.innerWidth <= 768;
      const isCollapsed = sidebar.classList.contains('collapsed');
      
              // Update main content margin with consistent logic
        if (mainContent) {
          let newMargin;
          if (isMobile) {
            newMargin = isCollapsed ? '280px' : '80px';
          } else {
            newMargin = isCollapsed ? '80px' : '280px';
          }
          mainContent.style.marginLeft = newMargin;
          mainContent.style.transition = 'margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
        }
      
      // Update toggle icon - use chevron left/right consistently
      const iconClass = isCollapsed 
        ? 'fas fa-chevron-right'  // Collapsed: show right arrow (expand)
        : 'fas fa-chevron-left';  // Expanded: show left arrow (collapse)
      sidebarToggle.querySelector('i').className = iconClass;
    }
    
    // Initialize sidebar state from localStorage
    const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
    if (isCollapsed) {
      sidebar.classList.add('collapsed');
    }
    
    // Initial state update
    updateSidebarState();
    
    // Handle window resize
    window.addEventListener('resize', function() {
      // Debounce resize events
      clearTimeout(window.resizeTimeout);
      window.resizeTimeout = setTimeout(function() {
        updateSidebarState();
      }, 100);
    });
    
    // Save sidebar state when toggled
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.attributeName === 'class') {
          const isCollapsed = sidebar.classList.contains('collapsed');
          localStorage.setItem('sidebarCollapsed', isCollapsed);
        }
      });
    });
    observer.observe(sidebar, { attributes: true });
  });
</script>
