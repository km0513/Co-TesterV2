<!DOCTYPE html>
<html>
<head>
  <title>Selenium Recorder</title>
  <style>
    body { font-family: Arial, sans-serif; min-width: 320px; }
    button { margin: 8px 0; }
    #status { font-weight: bold; margin: 8px 0; }
    #status.recording { color: green; }
    #status.stopped { color: red; }
    #steps { background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; max-height: 150px; overflow-y: auto; margin-bottom: 10px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>Selenium UI Recorder</h2>
  <div id="status" class="stopped">Recording: OFF</div>
  <button id="start">Start Recording</button>
  <button id="stop">Stop Recording</button>
  <button id="clear">Clear Steps</button>
  <div id="steps"></div>
  <button id="export">Export to Java</button>
  <pre id="output"></pre>
  <script src="popup.js"></script>
</body>
</html>
